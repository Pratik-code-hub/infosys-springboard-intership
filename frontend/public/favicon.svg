<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Medical Cross / Accent in background -->
  <rect x="29.5" y="14" width="5" height="36" rx="2.5" fill="#38BDF8" fill-opacity="0.15"/>
  <rect x="14" y="29.5" width="36" height="5" rx="2.5" fill="#38BDF8" fill-opacity="0.15"/>

  <!-- Dynamic ECG Pulse Wave -->
  <path d="M10 32 L21 32 L25 21 L30 43 L36 17 L41 35 L45 32 L54 32"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- AI Pulse Node -->
  <circle cx="36" cy="17" r="3" fill="#FFFFFF" filter="url(#glow)"/>
</svg>